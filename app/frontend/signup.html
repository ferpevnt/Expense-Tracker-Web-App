<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Expense Tracker</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-logo">✨</div>
      <h1>Create Account</h1>
      <p class="auth-subtitle">Start tracking your expenses today</p>

      <div id="message" class="message"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            minlength="2"
            maxlength="50"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            maxlength="56"
            autocomplete="new-password"
            required
          />
          <div class="password-hint">8–56 characters</div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Repeat password"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          Sign Up
        </button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
