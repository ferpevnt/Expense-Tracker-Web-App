<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — Expense Tracker</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <div class="page-container">
      <!-- ===== NAV ===== -->
      <nav class="navbar">
        <div class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="transactions.html">Transactions</a>
          <a href="categories.html">Categories</a>
          <a href="profile.html" class="active">Profile</a>
        </div>
        <div class="user-info">
          <span>👤 <span id="nav-user-name">User</span></span>
          <button class="btn btn-secondary" id="logout-btn">Logout</button>
        </div>
      </nav>

      <!-- ===== HEADER ===== -->
      <div class="page-header">
        <h2>Profile</h2>
      </div>

      <div id="message" class="message"></div>

      <!-- ===== PROFILE CARDS ===== -->
      <div class="profile-grid">
        <!-- Account info -->
        <div class="profile-card account-card">
          <div class="profile-avatar">👤</div>
          <div class="profile-info">
            <h3 id="display-name">—</h3>
            <p id="display-email" class="profile-email">—</p>
          </div>
        </div>

        <!-- Change name -->
        <div class="profile-card">
          <h3>Change Name</h3>
          <p class="profile-card-desc">Update your display name</p>

          <div id="name-message" class="message"></div>

          <div class="form-group">
            <label for="name-input">New name</label>
            <input
              type="text"
              id="name-input"
              placeholder="Your name"
              minlength="2"
              maxlength="50"
              autocomplete="name"
            />
          </div>

          <button class="btn btn-primary" id="save-name-btn">Save Name</button>
        </div>

        <!-- Change password -->
        <div class="profile-card">
          <h3>Change Password</h3>
          <p class="profile-card-desc">
            Choose a strong password (8–56 characters)
          </p>

          <div id="password-message" class="message"></div>

          <div class="form-group">
            <label for="current-password">Current password</label>
            <input
              type="password"
              id="current-password"
              placeholder="Your current password"
              autocomplete="current-password"
            />
          </div>

          <div class="form-group">
            <label for="new-password">New password</label>
            <input
              type="password"
              id="new-password"
              placeholder="At least 8 characters"
              minlength="8"
              maxlength="56"
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label for="confirm-new-password">Confirm new password</label>
            <input
              type="password"
              id="confirm-new-password"
              placeholder="Repeat new password"
              autocomplete="new-password"
            />
          </div>

          <button class="btn btn-primary" id="save-password-btn">
            Save Password
          </button>
        </div>

        <!-- Danger zone -->
        <div class="profile-card danger-card">
          <h3>⚠️ Danger Zone</h3>
          <p class="profile-card-desc">
            Deleting your account will permanently remove all your transactions
            and categories. <strong>This action cannot be undone.</strong>
          </p>

          <button class="btn btn-danger" id="delete-account-btn">
            Delete Account
          </button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
